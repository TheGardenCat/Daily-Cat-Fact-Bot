name: Daily Cat Fact Bot

on:
  schedule:
    # Runs every 6 hours. Change the cron below if you want.
    - cron: '0 */6 * * *'
  workflow_dispatch:  # This lets you run it manually from the Actions tab.

jobs:
  post-cat-fact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install nostr-tools @noble/hashes websocket-polyfill

      - name: Run Nostr Cat Fact Bot
        env:
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
        run: node bot.js
