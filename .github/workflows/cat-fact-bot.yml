name: Daily Cat Fact Bot

on:
  schedule:
    - cron: '0 12 * * *'   # runs daily at 12:00 UTC – you can change this
  workflow_dispatch:

permissions:
  contents: write   # Allows the bot to commit and push

jobs:
  post-cat-fact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # So we can push back

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize package.json
        run: npm init -y
        
      - name: Install dependencies
        run: npm install nostr-tools ws

      - name: Run Nostr Cat Fact Bot
        env:
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
        run: node bot.js
